<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 300px auto 300px;
            grid-template-rows: 70px auto 150px;
            grid-template-areas: 
                "header header header"
                "tree main bird"
                "tree main bird";
            height: 100vh;
            overflow: hidden;
        }

        header {
            grid-area: header;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-wrap: wrap; /* 🔑 za manju širinu ekrana */
        }

        header > div {
            font-size: 1.2rem;
            font-weight: bold;
        }

        form {
            display: flex;
            align-items: center;
        }

        .form-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-group input[type="file"] {
            max-width: 200px;
        }

        .form-group input[type="submit"] {
            padding: 5px 10px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #4cae4c;
        }

        #tree-view {
            grid-area: tree;
            background-color: #f3f3f3;
            padding: 10px;
            overflow-y: auto;
        }

        #main-view {
            grid-area: main;
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            position: relative;
            overflow: auto;
        }

        #bird-view {
            grid-area: bird;
            background-color: #fafafa;
            border: 1px solid #ddd;
            padding: 10px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3.v3.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>Graph Visualizer</div>
            <form action="{% url 'upload_file' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <input type="file" name="graph_file" required>
                    <input type="submit" value="Upload">
                </div>
            </form>
        </header>
        <div id="tree-view">
            <h3>Tree View</h3>
        </div>
        <div id="main-view">
            <h3>Main View</h3>
            {{ view_html|safe }}
        </div>
        <div id="bird-view">
            <h3>Bird View</h3>
        </div>
    </div>
</body>
</html>
