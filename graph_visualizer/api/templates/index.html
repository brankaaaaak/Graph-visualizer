<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 300px auto 300px;
            grid-template-rows: 70px auto 150px;
            grid-template-areas: 
                "header header header"
                "tree main bird"
                "tree main bird";
            height: 100vh;
            overflow: hidden;
        }

        header {
            grid-area: header;
            background-color:#fb045b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-wrap: wrap; 
        }
        .center-dropdown {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        #visualizer-select {
            padding: 5px 10px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            width: 200px; 
            min-width: 200px; 
        }
        header > div {
            font-size: 1.2rem;
            font-weight: bold;
        }

        form {
            display: flex;
            align-items: center;
        }

        .form-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-group input[type="file"] {
            max-width: 200px;
        }

        .form-group input[type="submit"] {
            padding: 5px 10px;
            background-color: #3c2956;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }


        .form-group input[type="submit"]:hover {
            background-color: #f3eef3;
            color: #3c2956;
        }

        #tree-view {
            grid-area: tree;
            background-color: #f3eee9;
            padding: 10px;
            overflow-y: auto;
        }

        #tree-view {
            color: #3c2956;
        }


        #main-view {
            grid-area: main;
            background-color: #eee1d5;
            border: 1px solid #ddd;
            padding: 10px;
            position: relative;
            overflow: auto;
        }

        #bird-view {
            grid-area: bird;
            background-color: #f3eee9;
            border: 1px solid #ddd;
            padding: 10px;
        }
        .tree-list {
            list-style: none;
            padding-left: 20px;
        }

        .tree-list li {
            margin: 5px 0;
        }

        .node-toggle {
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            color: #3c2956;
            font-weight: normal;
        }

        .node-toggle:hover {
            color: #fb045b
        }
        .submit-button {
            padding: 5px 12px;
            background-color: #3c2956;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 15px;
        }

        .submit-button:hover {
            background-color: #f3eee9;
            color: #3c2956;
        }
        .styled-select {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: 2px solid #3c2956;
            border-radius: 8px;
            background-color: #fff;
            color: #3c2956;
            font-weight: bold;
            appearance: none;
            cursor: pointer;
            min-width: 220px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .styled-select:hover {
            border-color: #fb045b;
        }

        .styled-select:focus {
            outline: none;
            border-color: #fb045b;
            box-shadow: 0 0 5px rgba(251, 4, 91, 0.4);
        }


    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3.v3.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>Graph Visualizer</div>
            <div class="center-dropdown">
        <form method="get" action="{% url 'visualize' %}">
            <select name="visualizer" required class="styled-select">
            <option value="" selected disabled>Choose visualizer...</option>
            <option value="simple-visualizer">Simple Visualizer</option>
            <option value="complex-visualizer">Complex Visualizer</option>
            </select>
            <button type="submit" class="submit-button">Go</button>
        </form>
        </div>

            <form action="{% url 'upload_file' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <input type="file" name="graph_file" required>
                    <input type="submit" value="Upload">
                </div>
            </form>
        </header>
        <div id="tree-view">
            <h3>Tree View</h3>
            {{ tree_html|safe }}
        </div>
        <div id="main-view">
            <h3>Main View</h3>
            {{ view_html|safe }}
        </div>
        <div id="bird-view">
            <h3>Bird View</h3>
        </div>
    </div>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.addEventListener("click", function (e) {
            if (e.target.classList.contains("node-toggle")) {
                e.preventDefault();

                const anchor = e.target;
                const li = anchor.closest("li");
                const nodeId = anchor.dataset.nodeId;

                // Ako je već otvoreno, samo sakrij djecu
                if (anchor.classList.contains("node-expanded")) {
                    const childUl = li.querySelector("ul");
                    if (childUl) {
                        childUl.remove();  // ukloni iz DOM-a
                    }
                    anchor.classList.remove("node-expanded");
                    anchor.innerHTML = anchor.innerHTML.replace("➖", "➕");
                    return;
                }

                // Inače – pošalji AJAX zahtjev na server
                fetch(`/expand_node?node_id=${nodeId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.html) {
                            const ul = document.createElement("ul");
                            ul.innerHTML = data.html;
                            li.appendChild(ul);
                            anchor.innerHTML = anchor.innerHTML.replace("➕", "➖");
                            anchor.classList.add("node-expanded");
                        }
                    });
            }
        });
    });
    </script>
</body>
</html>
