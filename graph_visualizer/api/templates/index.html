<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 300px auto 300px;
            grid-template-rows: 70px auto 150px;
            grid-template-areas: 
                "header header header"
                "tree main bird"
                "tree main bird";
            height: 100vh;
            overflow: hidden;
        }

        header {
            grid-area: header;
            background-color:#fb045b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-wrap: wrap; 
        }
        .center-dropdown {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        #visualizer-select {
            padding: 5px 10px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            width: 200px; 
            min-width: 200px; 
        }
        header > div {
            font-size: 1.2rem;
            font-weight: bold;
        }

        form {
            display: flex;
            align-items: center;
        }

        .form-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-group input[type="file"] {
            max-width: 200px;
        }

        .form-group input[type="submit"] {
            padding: 5px 10px;
            background-color: #3c2956;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }


        .form-group input[type="submit"]:hover {
            background-color: #f3eef3;
            color: #3c2956;
        }

        #tree-view {
            grid-area: tree;
            background-color: #f3eee9;
            padding: 10px;
            overflow-y: auto;
            color: #3c2956;
        }

        


        #main-view {
            grid-area: main;
            background-color: #eee1d5;
            border: 1px solid #ddd;
            padding: 10px;
            position: relative;
            overflow: auto;
        }

        #bird-view {
            grid-area: bird;
            background-color: #f3eee9;
            border: 1px solid #ddd;
            padding: 10px;
        }
        .tree-list {
            list-style: none;
            padding-left: 20px;
            font-size: 0.85rem;
        }

        .tree-list li {
            margin: 5px 0;
        }

        .node-toggle {
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            color: #3c2956;
            font-weight: normal;
        }

        .node-toggle:hover {
            color: #fb045b
        }
        .submit-button {
            padding: 5px 12px;
            background-color: #3c2956;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 15px;
        }

        .submit-button:hover {
            background-color: #f3eee9;
            color: #3c2956;
        }
        .styled-select {
            padding: 10px 15px;
            font-size: 1.1rem;
            border: 2px solid #3c2956;
            border-radius: 8px;
            background-color: #fff;
            color: #3c2956;
            font-weight: bold;
            appearance: none;
            cursor: pointer;
            min-width: 220px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .selected-node {
            background-color: #ffb6c1; /* svetlo roze */
            font-weight: bold;
        }
        #terminal {
            position: fixed;
            bottom: 60px;
            right: 20px;
            width: 400px;
            height: 300px;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            display: none;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 1000;
        }

        #toggleButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        #toggleButton:hover {
            background-color: #555;
        }
        #terminal-form {
        display: flex;
        align-items: center;
        margin-top: 10px;
        }

        #terminal-input {
        flex: 1;
        background-color: black;
        color: #0f0;
        border: none;
        font-family: monospace;
        font-size: 1rem;
        outline: none;
        }


    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="https://d3js.org/d3.v3.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>Graph Visualizer</div>
            <div class="center-dropdown">
                {% if graph_loaded %}
            <form method="get" action="{% url 'visualize' %}">
            <select name="visualizer" required class="styled-select">
                <option value="" selected disabled>Choose visualizer...</option>
                {% for id, name in visualizers %}
                    <option value="{{ id }}">{{ name }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="submit-button">Go</button>
        </form>
        {% else %}
            <p style="color: rgb(70, 23, 56); font-style: italic;">Please upload a file first to choose visualizer.</p>
        {% endif %}
        </div>
            <form action="{% url 'upload_file' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <input type="file" name="graph_file" required>
                    <input type="submit" value="Upload">
                </div>
            </form>
        </header>
        <div id="tree-view">
            <h3>Tree View</h3>
            {{ tree_html|safe }}
        </div>
        <div id="main-view">
            <h3>Main View</h3>
            {{ view_html|safe }}
        </div>
        <div id="bird-view">
            <h3>Bird View</h3>
        </div>
    </div>
    <div id="terminal">
        <div id="terminal-output">
            <p>Terminal running...</p>
        </div>
        <form id="terminal-form">
            <label for="terminal-input">$</label>
            <input type="text" id="terminal-input" autocomplete="off" autofocus />
        </form>
    </div>
    <button id="toggleButton">🖥️ Open terminal</button>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.addEventListener("click", function (e) {
            if (e.target.classList.contains("node-toggle")) {
                e.preventDefault();
                
                const anchor = e.target;
                const li = anchor.closest("li");
                const nodeId = anchor.dataset.nodeId || anchor.dataset.edgeId;


                if (anchor.classList.contains("node-expanded")) {
                    const childUl = li.querySelector("ul");
                    if (childUl) {
                        childUl.remove();
                    }
                    anchor.classList.remove("node-expanded");
                    anchor.innerHTML = anchor.innerHTML.replace("➖", "➕");
                    return;
                }

                if (li.querySelector("ul")) {
                    anchor.classList.add("node-expanded");
                    anchor.innerHTML = anchor.innerHTML.replace("➕", "➖");
                    return;
                }

                fetch(`/expand_node?node_id=${nodeId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.html) {
                            const ul = document.createElement("ul");
                            ul.innerHTML = data.html;
                            li.appendChild(ul);
                            anchor.innerHTML = anchor.innerHTML.replace("➕", "➖");
                            anchor.classList.add("node-expanded");
                        }
                    });
            }

        });
        const terminalOutput = document.getElementById("terminal-output");
        const terminalInput = document.getElementById("terminal-input");
        const terminalForm = document.getElementById("terminal-form");

    // PARSER ARGS
    function parseArgs(cmd) {
        const regex = /--(\w+)=("[^"]*"|'[^']*'|[^\s"]+)/g;
        const args = {};
        let match;
        while ((match = regex.exec(cmd)) !== null) {
            let key = match[1];
            let val = match[2];
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.slice(1, -1);
            }
            args[key] = val;
        }
        return args;
    }
    function extractPositionalArgs(cmd) {
        // Splituj komandu na delove po razmacima
        const parts = cmd.trim().split(/\s+/);
        // Filtriraj sve delove koji nisu u formatu --key=val
        return parts.filter(part => !part.startsWith("--") && !part.includes("=") && part !== "create" && part !== "edge");
    }

    // TERMINAL COMMAND HANDLER
    terminalForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const command = terminalInput.value.trim();
        terminalInput.value = "";

        if (!command) return;

        terminalOutput.innerHTML += `<div>$ ${command}</div>`;

        try {
            const [action, type] = command.split(" ");
            const args = parseArgs(command);
            const parts = command.split(" ");

            if (command === 'help') {
                terminalOutput.innerHTML += `<pre>
Komande:
create node --id=1 --property Name=Alice
create edge --id=1 --property Name=Siblings 1 2
edit node --id=1 --property Age=30
delete node --id=1
delete edge --id=1
filter 'Age>20'
search 'Name=Alice'
clear
</pre>`;
                return;
            }

            if (command === "clear") {
                return;
            }

            if (action === "create" && type === "node") {
                const args = parseArgs(command);
                const nodeId = args["id"];

                const propRegex = /--property\s+([^=\s]+)=([^\s]+)/g;
                const props = {};
                let match;
                while ((match = propRegex.exec(command)) !== null) {
                    props[match[1]] = match[2];
                }

                fetch("/api/create_node/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({ id: nodeId, properties: props })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        terminalOutput.innerHTML += `<div style="color:lightgreen;">Node ${nodeId} created.</div>`;
                        const currentVisualizer = "{{ current_visualizer|escapejs }}";
                        window.location.href = `/visualize?visualizer=${encodeURIComponent(currentVisualizer)}`;
                    } else {
                        terminalOutput.innerHTML += `<div style="color:red;">Error: ${data.error}</div>`;
                    }
                })
                .catch(err => {
                    terminalOutput.innerHTML += `<div style="color:red;">Request failed: ${err.message}</div>`;
                });
                return;
            }

            else if (action === "create" && type === "edge") {
                const args = parseArgs(command);
                const edgeId = args["id"];

                const parts = command.trim().split(/\s+/);
                const origin = parts[parts.length - 2];
                const target = parts[parts.length - 1];

                let relation = null;
                const propRegex = /--property\s+name=([^\s]+)/;
                const match = propRegex.exec(command);
                if (match) {
                    relation = match[1];
                } else {
                    terminalOutput.innerHTML += `<div style="color:red;">Error: Missing relation property.</div>`;
                    return;
                }

                const bodyData = {
                    id: edgeId,
                    source: origin,
                    target: target,
                    relation: relation
                };

                fetch("/api/create_edge/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                   body: JSON.stringify(bodyData)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        terminalOutput.innerHTML += `<div style="color:lightgreen;">Edge created.</div>`;
                        const currentVisualizer = "{{ current_visualizer|escapejs }}";
                        window.location.href = `/visualize?visualizer=${encodeURIComponent(currentVisualizer)}`;
                    } else {
                        terminalOutput.innerHTML += `<div style="color:red;">Error: ${data.error}</div>`;
                    }
                })
                .catch(err => {
                    terminalOutput.innerHTML += `<div style="color:red;">Request failed: ${err.message}</div>`;
                });

                return;
}


            else if (action === "edit" && type === "node") {
               const parts = command.split(" ");
                if (parts.length < 4) {
                    terminalOutput.innerHTML += `<div style="color:red;">Greška: format treba biti: edit node [id] [key]=[value]</div>`;
                    return;
                }
                const nodeId = parts[2]; 
                const propertyPart = parts.slice(3).join(" ");

                if (!propertyPart.includes("=")) {
                    terminalOutput.innerHTML += `<div style="color:red;">Greška: property treba biti u formatu key=value</div>`;
                    return;
                }

                const [keyRaw, ...valueParts] = propertyPart.split("=");
                const key = keyRaw.trim();
                const value = valueParts.join("=").trim();

                if (!key || !value) {
                    terminalOutput.innerHTML += `<div style="color:red;">Greška: property treba biti u formatu key=value</div>`;
                    return;
                }

                const props = {};
                props[key] = value;

                fetch("/api/edit_node/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({ id: nodeId, properties: props })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        terminalOutput.innerHTML += `<div style="color:lightgreen;">Node ${nodeId} updated.</div>`;
                        const currentVisualizer = "{{ current_visualizer|escapejs }}";
                        window.location.href = `/visualize?visualizer=${encodeURIComponent(currentVisualizer)}`;
                    } else {
                        terminalOutput.innerHTML += `<div style="color:red;">Error: ${data.error}</div>`;
                    }
                })
                .catch(err => {
                    terminalOutput.innerHTML += `<div style="color:red;">Request failed: ${err.message}</div>`;
                });

                return;
            }

            else if (action === "delete" && type === "node") {
                const nodeId = args["id"];

                fetch(`/api/delete_node/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({ id: nodeId })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        terminalOutput.innerHTML += `<div style="color:lightgreen;">Node ${nodeId} deleted.</div>`;
                        const currentVisualizer = "{{ current_visualizer|escapejs }}";
                        window.location.href = `/visualize?visualizer=${encodeURIComponent(currentVisualizer)}`;
                    } else {
                        terminalOutput.innerHTML += `<div style="color:red;">Error: ${data.error}</div>`;
                    }
                })
                .catch(err => {
                    terminalOutput.innerHTML += `<div style="color:red;">Request failed: ${err.message}</div>`;
                });
                return;
            }

            else if (action === "delete" && type === "edge") {
                const parts = command.split(" ");

                if (parts.length < 5) {
                    terminalOutput.innerHTML += `<div style="color:red;">Greška: Unos treba da bude: delete edge [origin] [relation] [target]</div>`;
                    return;
                }

                const origin = parts[2];
                const relation = parts[3];
                const target = parts[4];

                fetch(`/api/delete_edge/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({ origin: origin, relation: relation, target: target })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        terminalOutput.innerHTML += `<div style="color:lightgreen;">Edge from ${origin} to ${target} (${relation}) deleted.</div>`;
                        const currentVisualizer = "{{ current_visualizer|escapejs }}";
                        window.location.href = `/visualize?visualizer=${encodeURIComponent(currentVisualizer)}`;
                    } else {
                        terminalOutput.innerHTML += `<div style="color:red;">Error: ${data.error}</div>`;
                    }
                })
                .catch(err => {
                    terminalOutput.innerHTML += `<div style="color:red;">Request failed: ${err.message}</div>`;
                });

                return;
            }

            else if (command.startsWith("search ")) {
                return;
            }

            else if (command.startsWith("filter ")) {
                return;
            }

            else {
                terminalOutput.innerHTML += "<div>Unknown command. Try 'help'</div>";
            }

        } catch (err) {
            terminalOutput.innerHTML += `<div style="color:red;">Greška: ${err.message}</div>`;
        }

        terminalOutput.scrollTop = terminalOutput.scrollHeight;
    });

    // Terminal show/hide
    const terminal = document.getElementById('terminal');
    const toggleButton = document.getElementById('toggleButton');

    toggleButton.addEventListener('click', () => {
        if (terminal.style.display === 'none') {
            terminal.style.display = 'block';
            toggleButton.textContent = '🗙 Close terminal';
            terminalInput.focus();
        } else {
            terminal.style.display = 'none';
            toggleButton.textContent = '🖥️ Open terminal';
        }
    });
});
    </script>
</body>
</html>
